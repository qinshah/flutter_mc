name: flutter_mc
description: "flutter_mc —— 基于 flutter_scene 的 Minecraft 复刻。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.0
  # 3D 数学库（向量、四元数、矩阵、Ray 等），flutter_scene 反复使用。
  vector_math: 2.4.2
  # 应用文档目录（存档与缓存目录定位）。开始适配鸿蒙
  path_provider:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos_dev
  # 解除系统刷新率上限。开发期用于观察帧率。
  refresh_rate: 1.0.2
  # MC 协议层四包（自 fscraft packages 原样搬入）。
  mc_nbt:
    path: packages/mc_nbt
  mc_wire:
    path: packages/mc_wire
  mc_session:
    path: packages/mc_session
  mc_protocol_v26_2:
    path: packages/mc_protocol_v26_2
  # 渲染数据 / 资源抽象 / UI 组件三包骨架（实现见后续 change）。
  mc_render:
    path: packages/mc_render
  mc_resource:
    path: packages/mc_resource
  mc_ui:
    path: packages/mc_ui
  # hook/build.dart 用：Dart 构建钩子 API（flutter_scene 的 buildTextures 等在此
  # 调用，只在构建期跑）。列在常规依赖里是因为它经 flutter_scene 本就传递进来，
  # 且 lint depend_on_referenced_packages 对 hook/ 这类非 test/tool 目录只认常规依赖。
  hooks: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # tool/driver_main.dart 调试入口用：dart MCP 的 flutter_driver_command 驱动界面
  flutter_driver:
    sdk: flutter
  # tool/extract_assets.dart 用：zip（client jar）读取
  archive: ^4.0.0
  # tool/extract_assets.dart 图集拼接用
  image: ^4.0.0

flutter:
  uses-material-design: true
  # 官方资产提取产物（构建期运行 tool/extract_assets.dart 生成，gitignore 不入库；
  # 缺失时构建仍通过、运行期资产读取降级为顶点色）。
  #
  # **必须逐个子目录声明**：Flutter 的目录资产声明只收该目录下的**直接文件**，
  # 不递归子目录——早先只写 `assets/vanilla/26_2/` 时，打进包的只有 .gitkeep，
  # 于是图集永远读不到（4.1 端到端实测）。
  #
  # 运行时只需要这三样：预拼图集（generated/）、方块状态与模型（blockstates/、
  # models/block/，mc_resource 用来把 state 映射到贴图路径，再查图集取 UV）。
  # **不带 textures/block/**：1269 张逐张贴图只是提取器的输入，图集里已有像素。
  assets:
    - assets/vanilla/26_2/generated/
    - assets/vanilla/26_2/blockstates/
    - assets/vanilla/26_2/models/block/
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
